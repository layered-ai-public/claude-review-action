name: Claude Review

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to review (only needed for workflow_dispatch callers)
        required: false
        type: string
      model:
        description: Claude model to use for the review
        required: false
        type: string
        default: claude-sonnet-5
    secrets:
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        required: false

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Review pull request
        uses: layered-ai-public/claude-review-action@main
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          pr_number: ${{ inputs.pr_number }}
          model: ${{ inputs.model }}
