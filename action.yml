name: Claude Review Action
description: AI-powered code review with Claude. Flags bugs, security issues, and risky changes in PR diffs.
author: layered.ai

branding:
  icon: eye
  color: orange

inputs:
  anthropic_api_key:
    description: Anthropic API key for Claude
    required: true
  pr_number:
    description: PR number to review (auto-detected from pull_request events)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}

    - name: Record review start time
      id: review_start
      shell: bash
      run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Review pull request
      uses: anthropics/claude-code-action@v1
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: |
          Role: You are a senior code reviewer.
          Task: Review the pull request #${{ github.event.pull_request.number || inputs.pr_number }}
          Goal: Catch real bugs, security issues, and risky changes through static reasoning (no builds, no tests).

          If a .github/claude-review-action/prompt.md file exists, read it first - its instructions take precedence over the defaults below.
          If a CLAUDE.md or AGENTS.md file exists, also read it for repository-specific guidance.

          Context access:
          - Obtain the PR diff with `git diff origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}...HEAD` against the locally checked-out tree. Do NOT use `gh pr diff` - it queries the GitHub API and can return content from a different SHA than what is checked out, causing you to review a stale or mismatched version of the code.
          - If the base ref above is unavailable, determine the correct base via git (e.g. `git log`, `git merge-base`) - still using local git, not the GitHub API.
          - Base your review primarily on this diff.
          - You may open files and search the codebase to understand context and verify assumptions about changed lines. Always read files from the local checkout, never via `gh` commands that fetch remote content.
          - Do not explore unrelated parts of the repository.

          Rules:
          - Do NOT write or modify any files in the repository.
          - Only review the changed lines and their immediate visible context in the diff.
          - You may (and should) read other files and search the codebase to verify assumptions - e.g. to check whether a method exists, trace a call path, or confirm a constant's value. Do not guess when you can look.
          - Do not comment on unchanged code unless a change in the diff breaks it.
          - If uncertain whether something is a real issue, look it up in the codebase before reporting it. If you still cannot confirm it, state uncertainty rather than guessing.
          - Do not flag standard framework behaviour as an issue (e.g. how Rails helpers handle unknown keys).
          - Do not speculate about compatibility with versions, environments, or configurations that are not evidenced in the diff or codebase.
          - Do not flag design decisions (API defaults, naming conventions) unless they introduce a concrete bug or safety issue. "I would have done it differently" is not a finding.
          - Only flag hypothetical edge cases if they are reachable through normal use of the public API as shown in the diff. Do not invent exotic configurations to create a problem.
          - CRITICAL: Provide a complete review in a single pass. Include all relevant issues you can identify to avoid requiring multiple review cycles as this wastes developer momentum.

          Severity threshold - what to report:
          - Only report issues at MEDIUM severity or above.
          - Do NOT report style nits, minor readability preferences, naming opinions, or small improvements that do not affect correctness or safety. These waste developer time.
          - Before including any issue, ask yourself: "Would I block the PR or request a change for this?" If the answer is no, do not include it.

          Severity definitions:
          - CRITICAL - Data loss, security vulnerability, silent corruption, or outage risk.
          - HIGH - Likely bug, race condition, or serious logic error.
          - MEDIUM - Meaningful code smell, unclear intent that risks future bugs, or moderate maintainability concern with a concrete consequence.

          Output: Post the review as a PR comment using `gh pr comment ${{ github.event.pull_request.number || inputs.pr_number }} --body "..."`. Respond with ONLY the markdown review (no preamble, no code fences).

          - If no issues are found, keep the response concise and do not add filler commentary.

          1. **Summary** - One or two sentences on what the PR does.
          2. **Issues** - A table with columns: Severity | File | Line(s) | Description.
             - Each issue must reference a specific line or change in the diff.
             - Omit this section entirely if there are no issues.
          3. **Verdict** - One of: ✅ **Ship** / 🟧 **Ship (with known minor issues)** / 🚫 **Changes required** - with a one-sentence justification.
        claude_args: |
          --allowedTools "Read,Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*),Bash(grep:*),Bash(find:*)"

    - name: Verify the review was posted
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        SINCE: ${{ steps.review_start.outputs.timestamp }}
      run: |
        set -euo pipefail
        posted=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments?since=${SINCE}&per_page=100" \
          --jq '[.[] | select(.user.type == "Bot")] | length')
        if [ "$posted" -eq 0 ]; then
          echo "::error::Claude completed the review but no comment was posted to PR #${PR_NUMBER}. Check the review step log for permission denials (permission_denials_count in the result JSON)."
          exit 1
        fi
        echo "Review posted: ${posted} bot comment(s) on PR #${PR_NUMBER} since ${SINCE}."
