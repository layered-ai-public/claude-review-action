name: Claude Review Action
description: AI-powered code review with Claude. Flags bugs, security issues, and risky changes in PR diffs.
author: layered.ai

branding:
  icon: eye
  color: orange

inputs:
  anthropic_api_key:
    description: Anthropic API key for Claude
    required: true
  pr_number:
    description: PR number to review (auto-detected from pull_request events)
    required: false
    default: ""
  model:
    description: Claude model to use for the review
    required: false
    default: claude-sonnet-5

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}

    - name: Record review start time
      id: review_start
      shell: bash
      run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

    - name: Review pull request
      id: review
      uses: anthropics/claude-code-action@v1
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: |
          Role: You are a senior code reviewer.
          Task: Review the pull request #${{ github.event.pull_request.number || inputs.pr_number }}
          Goal: Catch real bugs, security issues, and risky changes through static reasoning (no builds, no tests).

          If a .github/claude-review-action/prompt.md file exists, read it first - its instructions take precedence over the defaults below.
          If a CLAUDE.md or AGENTS.md file exists, also read it for repository-specific guidance.

          Context access:
          - Obtain the PR diff with `git diff origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}...HEAD` against the locally checked-out tree. Do NOT use `gh pr diff` - it queries the GitHub API and can return content from a different SHA than what is checked out, causing you to review a stale or mismatched version of the code.
          - If the base ref above is unavailable, determine the correct base via git (e.g. `git log`, `git merge-base`) - still using local git, not the GitHub API.
          - Base your review primarily on this diff.
          - You may open files and search the codebase to understand context and verify assumptions about changed lines. Always read files from the local checkout, never via `gh` commands that fetch remote content.
          - Do not explore unrelated parts of the repository.

          This run is non-interactive:
          - There is no human watching and nothing you ask for can be approved. A question in your final response is posted to the pull request verbatim, in place of the review.
          - If a command is denied, do not retry it in a different shape and do not ask for approval. Note what you could not do and carry on with what the allowlist gives you - the checkout is complete and local git is enough to review from.
          - Whatever else happens, your final response must still be the complete review, ending with the Verdict section.

          Rules:
          - Do NOT write or modify any files in the repository. The single exception is `${{ runner.temp }}/claude-review.md`, which is outside the repository and is where you put the review before posting it.
          - Only review the changed lines and their immediate visible context in the diff.
          - You may (and should) read other files and search the codebase to verify assumptions - e.g. to check whether a method exists, trace a call path, or confirm a constant's value. Do not guess when you can look.
          - Do not comment on unchanged code unless a change in the diff breaks it.
          - If uncertain whether something is a real issue, look it up in the codebase before reporting it. If you still cannot confirm it, state uncertainty rather than guessing.
          - Do not flag standard framework behaviour as an issue (e.g. how Rails helpers handle unknown keys).
          - Do not speculate about compatibility with versions, environments, or configurations that are not evidenced in the diff or codebase.
          - Do not flag design decisions (API defaults, naming conventions) unless they introduce a concrete bug or safety issue. "I would have done it differently" is not a finding.
          - Only flag hypothetical edge cases if they are reachable through normal use of the public API as shown in the diff. Do not invent exotic configurations to create a problem.
          - IMPORTANT: Provide a complete review in a single pass, so the developer does not need a second review cycle. Completeness means every real issue, not every observation. A review with no issues is a successful review - say so plainly and stop. Padding a review with minor findings to look thorough wastes more developer time than a missed nit.

          Partial context is expected:
          - You will often see only one side of a boundary - a frontend consuming an API, a client of a library, a service calling another service. The contract on the other side is not in this diff.
          - Do not report missing defensive handling of a value the code treats as guaranteed (e.g. a `user` object the API always returns) unless the diff or codebase shows it can actually be absent. Look for the contract first; if you cannot find it, assume the author knows their own API.
          - If a finding depends on an assumption you could not verify, say so in a single "Assumptions" line after the Issues section - do not convert an unverified assumption into a finding.

          Severity assignment - assign BEFORE deciding what to report. Severity is trigger AND impact; a nameable trigger alone does not raise a finding above MEDIUM.
          - CRITICAL - You can name the input or state that causes data loss, a security breach, silent corruption, or an outage, and the path to it is reachable from the code as changed.
          - HIGH - You can name the input or state, AND the resulting behaviour matters: wrong data, broken functionality, or a failure a user would notice and care about.
          - MEDIUM - Either a nameable trigger whose impact is small (cosmetic, log-only, easily recovered from), or no specific trigger but the change makes a concrete future failure likely and you can say what that failure is.
          - LOW - Everything else: style, naming, readability, preference, "I would have done it differently", theoretical concerns you cannot trigger.

          Every finding must carry a failure scenario: specific input or state, then the specific wrong result. If you cannot write one, the finding is LOW - regardless of how serious the subject matter sounds. Touching authentication, payments, or user data does not by itself make a finding CRITICAL; a demonstrated consequence does.

          A trivial defect stays MEDIUM even when the trigger is obvious. A misspelled log message, a wrong label, or a misleading comment is MEDIUM, not HIGH, because the verdict below blocks the PR on HIGH.

          Report CRITICAL, HIGH, and MEDIUM. Discard LOW entirely - do not report it as an issue and do not append it as a note or a list of nits. The single exception is the assumption line described under "Partial context is expected": that line records what you could not verify rather than a finding, and it should still appear when applicable.

          Before writing the review, re-examine each finding and try to disprove it:
          - Read the actual code around it. Does the problem survive contact with what is really there?
          - Is the trigger reachable through normal use of this code, or did you have to invent an unusual configuration?
          - Would a competent engineer reading this diff call it a real problem, or a matter of taste?
          - Verify every `path:line` you are about to cite against the file in the local checkout. Line numbers must come from reading the file itself (e.g. `wc -l` for its length, then `sed -n` or Read around the line), never from a diff hunk header, a hunk offset, or memory of where the code "should" be. A citation past the end of the file is the clearest sign a review is wrong about the code, and it makes the whole review look like it ran against a different revision.
          - If you cannot confirm the line, cite the file path alone and name the symbol (method, constant, class) instead. A path plus a symbol name is always better than an invented line number.

          If you cannot defend a finding after that, drop it. Prefer dropping a doubtful finding over reporting it with a caveat.

          Output:
          - Posting the review is the last thing you do, and it is required. Do it in two steps:
            1. Write the complete review markdown to `${{ runner.temp }}/claude-review.md` using the `Write` tool. This path is outside the repository and is the one file you are permitted to create.
            2. Run `gh pr comment ${{ github.event.pull_request.number || inputs.pr_number }} --body-file ${{ runner.temp }}/claude-review.md`.
          - Do NOT pass the review as an inline `--body "..."` argument. The shell performs command substitution inside double quotes, so every backtick-quoted path, symbol, and code span in the review is executed as a command and replaced with its empty output - the posted comment loses exactly the file and symbol names that make it readable. `--body-file` is the only permitted shape; an inline `--body` will be denied.
          - If either step is denied or fails, do not give up silently: say so in your final response and still end that response with the complete review.
          - Your final response must be ONLY the markdown review (no preamble, no code fences), so that it can be posted for you if the command did not land.

          - If no issues are found, keep the response concise and do not add filler commentary.

          1. **Summary** - One or two sentences on what the PR does.
          2. **Issues** - One block per issue, most severe first. Do NOT use a table - reviews are read in narrow PR columns where wide tables become unreadable. Use exactly this shape:

             #### SEVERITY - `path/to/file.ext:LINE`
             **Trigger:** the input or state, then the wrong result it produces.

             One or two sentences on the issue and what to do about it.

             - Each issue must reference a specific line or change in the diff.
             - Omit this section entirely if there are no issues.
          3. **Assumptions** - Only if a finding depended on something you could not verify. A single line. Omit the section otherwise.
          4. **Verdict** - with a one-sentence justification:
             - ✅ **Ship** - no findings at all.
             - 🟧 **Ship (medium findings to address)** - MEDIUM findings only, no CRITICAL or HIGH.
             - 🚫 **Changes required** - one or more CRITICAL or HIGH findings.
        claude_args: |
          --model "${{ inputs.model }}"
          --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git fetch:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*)"

    - name: Verify the review was posted
      if: always() && steps.review.outcome != 'skipped'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        SINCE: ${{ steps.review_start.outputs.timestamp }}
        EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
      run: |
        set -euo pipefail

        RESULT="${RUNNER_TEMP}/claude-result.json"
        BODY="${RUNNER_TEMP}/claude-review-body.md"

        # The review step hides its own output, so the execution log is the only
        # place the denial list and the final review text can be read from.
        # -s plus flatten reads it whether it is a JSON array or JSON lines.
        if [ -n "${EXECUTION_FILE:-}" ] && [ -f "${EXECUTION_FILE}" ]; then
          jq -s 'flatten(1) | [.[] | select(.type == "result")] | last // {}' \
            "${EXECUTION_FILE}" > "${RESULT}"
        else
          echo '{}' > "${RESULT}"
        fi

        # Always report denials: a review that spent its turns fighting the
        # allowlist is the usual reason no comment lands.
        denials=$(jq -r '(.permission_denials // []) | length' "${RESULT}")
        if [ "${denials:-0}" -gt 0 ]; then
          echo "::warning::The review run recorded ${denials} permission denial(s) - these tools are not in --allowedTools:"
          jq -r '(.permission_denials // [])[]
                 | "\(.tool_name): \((.tool_input.command // (.tool_input | tostring))[0:120])"' \
            "${RESULT}" | sort | uniq -c | sort -rn
        fi

        bot_comments() {
          gh api \
            "repos/${REPO}/issues/${PR_NUMBER}/comments?since=${SINCE}&per_page=100" \
            --jq '[.[] | select(.user.type == "Bot")]'
        }

        # Two passes: the comments API can lag behind a successful post, and
        # double-posting a review is worse than waiting a few seconds for it.
        for attempt in 1 2; do
          comments=$(bot_comments)
          posted=$(printf '%s' "${comments}" | jq 'length')
          if [ "${posted}" -gt 0 ]; then
            echo "Review posted: ${posted} bot comment(s) on PR #${PR_NUMBER} since ${SINCE}."
            # An empty `` code span means the review went through an inline
            # --body "...": the shell ran each backtick span as a command and
            # substituted its empty output, stripping the file and symbol names.
            blanks=$(printf '%s' "${comments}" \
              | jq -r 'last.body // ""' \
              | grep -cE '(^|[^`])``([^`]|$)' || true)
            if [ "${blanks:-0}" -gt 0 ]; then
              echo "::warning::The posted review contains ${blanks} empty code span(s) - it was probably posted with an inline \`--body \"...\"\` instead of --body-file, so backtick-quoted paths and symbols were eaten by shell command substitution."
            fi
            exit 0
          fi
          if [ "${attempt}" -eq 1 ]; then sleep 5; fi
        done

        # The review file Claude was told to write is the faithful copy; the
        # execution log's final response is the fallback when it never got there.
        REVIEW_FILE="${RUNNER_TEMP}/claude-review.md"
        if [ -s "${REVIEW_FILE}" ]; then
          echo "No comment landed on PR #${PR_NUMBER}; recovering the review from ${REVIEW_FILE}."
          cp "${REVIEW_FILE}" "${BODY}"
        else
          echo "No comment landed on PR #${PR_NUMBER}; recovering the review from the execution log."
          jq -r '.result // empty' "${RESULT}" > "${BODY}"
        fi

        if [ "$(wc -c < "${BODY}")" -lt 40 ]; then
          echo "::error::Claude completed the review but no comment was posted to PR #${PR_NUMBER}, and its final response was empty or too short to post."
          exit 1
        fi

        # Post a recovered body only if it is actually a review. When Claude
        # ends its turn asking for approval of a denied command, the fallback
        # would otherwise put that question on the PR in place of the review.
        # Every review shape ends in a Verdict section; a question never does.
        if ! grep -qiE '(^|[^[:alnum:]])verdict' "${BODY}"; then
          echo "::error::Claude completed the review step but no comment was posted to PR #${PR_NUMBER}, and its final response is not a review - it has no Verdict section, so it was not posted. The response follows."
          cat "${BODY}"
          exit 1
        fi

        gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${BODY}"
        rm -f "${BODY}" "${RESULT}"
        echo "::warning::Claude did not post the review itself; it was recovered and posted by the verification step."
